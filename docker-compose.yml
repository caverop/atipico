services:
  api:
    build:
      context: .
      dockerfile: Atipico.Api/Dockerfile
    ports:
      - "15000:10000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-Atipico.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Atipico.Clients}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-480}
      # Comprobantes de pago QR (ver docs/comprobantes-qr.md). Los valores salen de .env,
      # que no se commitea. Solo la API habla con R2: el Web le pide la URL firmada.
      R2__AccountId: ${R2__AccountId}
      R2__AccessKeyId: ${R2__AccessKeyId}
      R2__SecretAccessKey: ${R2__SecretAccessKey}
      R2__Bucket: ${R2__Bucket:-atipico-comprobantes-dev}

  web:
    build:
      context: .
      dockerfile: Atipico.Web/Dockerfile
    ports:
      - "15001:10000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # "api" resuelve al contenedor de arriba por el nombre del servicio, via la red
      # que crea compose automaticamente — no hace falta host.docker.internal aca.
      ApiBaseUrl: http://api:10000
    volumes:
      # El llavero de Data Protection, que cifra la cookie de sesion y el token antiforgery.
      # Sin este volumen se pierde al recrear el contenedor: al levantar de nuevo las claves
      # son otras, lo cifrado con las anteriores ya no se puede descifrar, y aparece
      # "The antiforgery token could not be decrypted" ademas de cerrarse todas las sesiones.
      - atipico-keys:/var/atipico/keys
    depends_on:
      - api

volumes:
  atipico-keys:
