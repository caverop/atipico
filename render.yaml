services:
  - type: web
    name: atipico-api
    runtime: docker
    dockerfilePath: ./Atipico.Api/Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        sync: false
      - key: Jwt__Audience
        sync: false
      - key: Jwt__ExpiryMinutes
        sync: false
      # Comprobantes de pago QR (ver docs/comprobantes-qr.md). Bucket de produccion:
      # atipico-comprobantes. Los valores se cargan en el dashboard, no aca.
      - key: R2__AccountId
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__Bucket
        sync: false

  - type: web
    name: atipico-web
    runtime: docker
    dockerfilePath: ./Atipico.Web/Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ApiBaseUrl
        sync: false
