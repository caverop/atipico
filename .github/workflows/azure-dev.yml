# Run when commits are pushed to main
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to the production branch
    branches:
      - main

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_R2_ACCOUNT_ID: ${{ vars.AZURE_R2_ACCOUNT_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_R2_BUCKET: ${{ vars.AZURE_R2_BUCKET }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      # Dominio publico y nombre del certificado administrado que lo respalda. Van como vars y
      # no como secrets porque no son secretos. .azure esta en .gitignore, asi que el runner no
      # tiene el config.json con los valores locales: azd los toma de aca. Si faltan,
      # `azd provision --no-prompt` falla por parametro ausente -- ruidoso, que es lo que se
      # quiere: el fallo anterior era silencioso y se llevaba el dominio puesto.
      # Ver specs/dominio-personalizado-azure.md.
      AZURE_CUSTOM_DOMAIN: ${{ vars.AZURE_CUSTOM_DOMAIN }}
      AZURE_CERTIFICATE_NAME: ${{ vars.AZURE_CERTIFICATE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh


      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_DB_CONNECTION_STRING: ${{ secrets.AZURE_DB_CONNECTION_STRING }}
          AZURE_R2_SECRET_ACCESS_KEY: ${{ secrets.AZURE_R2_SECRET_ACCESS_KEY }}
          AZURE_JWT_KEY: ${{ secrets.AZURE_JWT_KEY }}
          AZURE_R2_ACCESS_KEY_ID: ${{ secrets.AZURE_R2_ACCESS_KEY_ID }}

      - name: Deploy Application
        run: azd deploy --no-prompt
        env:
          AZURE_DB_CONNECTION_STRING: ${{ secrets.AZURE_DB_CONNECTION_STRING }}
          AZURE_R2_SECRET_ACCESS_KEY: ${{ secrets.AZURE_R2_SECRET_ACCESS_KEY }}
          AZURE_JWT_KEY: ${{ secrets.AZURE_JWT_KEY }}
          AZURE_R2_ACCESS_KEY_ID: ${{ secrets.AZURE_R2_ACCESS_KEY_ID }}
        
